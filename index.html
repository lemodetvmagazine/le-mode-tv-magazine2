
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="Le Mode TV Magazine: artículos permanentes sobre moda, belleza, cultura, estilo de vida y tecnología.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Le Mode TV Magazine | Revista digital</title>
<style>
:root{--black:#080808;--gold:#c9a34a;--gold2:#e8cf91;--paper:#fff;--cream:#f5f2eb;--muted:#777;--line:#e8e3d9;--red:#a92b31}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#172016 url("B937CFFC-B4EB-4FDC-A485-990E82BFCA8C.png") center center / cover fixed no-repeat;color:#171717;font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
header{background:var(--black);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #0003}
.brand{display:flex;align-items:center;justify-content:center;padding:0;background:#080808;min-height:88px}
.brand-link{display:flex;align-items:center;justify-content:center;width:100%;max-width:900px;padding:4px 12px}
.brand-logo{display:block;width:min(100%,760px);height:auto;max-height:112px;object-fit:contain}
.redline{height:2px;width:35px;background:var(--red)}
nav{display:flex;gap:7px;overflow:auto;padding:0 12px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:1px solid #484848;color:#ddd;border-radius:22px;padding:9px 14px;white-space:nowrap;font-size:13px}
nav button.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:bold}
.wrap{max-width:1080px;margin:auto;padding:16px 14px 100px}
.hero{border-radius:17px;overflow:hidden;background:radial-gradient(circle at 78% 20%,#9b7a3b 0,#49391f 28%,transparent 52%),linear-gradient(125deg,#080808,#29251e 60%,#111);color:white;min-height:290px;display:flex;align-items:end;position:relative;padding:25px}
.hero:before{content:'LE MODE';position:absolute;right:-8px;top:18px;font-family:Georgia,serif;font-size:clamp(48px,12vw,112px);color:#fff0e;opacity:.08;white-space:nowrap}
.hero-content{position:relative;max-width:650px}
.eyebrow{color:var(--gold2);font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}
.hero h1{font:bold clamp(30px,6vw,48px)/1.05 Georgia,serif;margin:12px 0}
.hero p{color:#eee;line-height:1.55;margin:0 0 18px;max-width:560px}
.btn{border:0;border-radius:25px;background:var(--gold);color:#111;padding:12px 18px;font-weight:bold;cursor:pointer}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d6ad4f;outline-offset:3px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:27px 2px 12px}
.section-head h2{font:bold 24px Georgia,serif;margin:0}
.section-head small{color:var(--muted)}
.intro{color:#666;line-height:1.55;margin:0 2px 12px}
.search{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #ddd;font-size:15px;margin:13px 0;background:rgba(255,255,255,.97)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #00000008;display:flex;flex-direction:column}
.art{height:125px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111,#65502c);color:#f0d38b;font:22px Georgia,serif;text-align:center;padding:12px;letter-spacing:1px}
.art[data-tone="rose"]{background:linear-gradient(135deg,#281518,#a85e61)}
.art[data-tone="light"]{background:linear-gradient(135deg,#f3eee4,#bca77d);color:#191714}
.art[data-tone="blue"]{background:linear-gradient(135deg,#101d2a,#536a7c)}
.art[data-tone="green"]{background:linear-gradient(135deg,#13231e,#687c62)}
.card-body{padding:13px;display:flex;flex-direction:column;flex:1}
.tag{font-size:10px;letter-spacing:1.2px;color:#98711d;font-weight:bold;text-transform:uppercase}
.card h3{font: bold 18px/1.2 Georgia,serif;margin:8px 0}
.card p{font-size:13px;color:#666;line-height:1.5;margin:0 0 14px}
.text-btn{border:0;background:none;color:#805d17;font-weight:bold;padding:0;text-align:left;cursor:pointer;margin-top:auto}
.empty{padding:28px;text-align:center;color:#666;background:white;border-radius:12px;grid-column:1/-1}
.panel{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;padding:17px;margin-top:18px}
.panel h2{font:23px Georgia,serif;margin:0 0 8px}
.panel p{color:#666;line-height:1.55}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{border:1px solid #ddd;background:#fff;color:#222;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:13px}
.notice{font-size:12px;color:#777;margin-top:20px;text-align:center;line-height:1.5}
.footer{text-align:center;padding:20px;color:#777;font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#080808;color:#eee;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:12;border-top:1px solid #333}
.bottom button{background:none;border:0;color:#bbb;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:50px;cursor:pointer}
.bottom button b{font-size:19px;font-weight:normal}
.bottom button.active{color:var(--gold)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:end;justify-content:center}
.modal.open{display:flex}
.modalbox{background:#fff;border-radius:18px 18px 0 0;max-width:780px;width:100%;padding:21px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.modalbox h2{font:bold 29px/1.12 Georgia,serif;margin:12px 42px 8px 0}
.modal-meta{font-size:12px;color:#98711d;text-transform:uppercase;letter-spacing:1px;font-weight:bold;margin-bottom:16px}
.modal-content{color:#444;line-height:1.75;font-size:15px}
.modal-content h3{font:bold 19px Georgia,serif;color:#171717;margin:23px 0 8px}
.modal-content p{margin:0 0 14px}
.modal-content ul{padding-left:21px}
.modal-content li{margin-bottom:8px}
.close{float:right;border:0;background:#eee;border-radius:50%;width:37px;height:37px;font-size:22px;cursor:pointer}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.secondary{border:1px solid #ccc;background:#fff;color:#222;border-radius:25px;padding:11px 16px;font-weight:bold;cursor:pointer}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.art{height:150px}.hero{min-height:330px}.wrap{padding-top:24px}.modal{align-items:center;padding:20px}.modalbox{border-radius:18px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.hero{min-height:270px;padding:20px}}
</style>
</head>
<body>
<header>
  <div class="brand"><a class="brand-link" href="./" aria-label="Le Mode TV Magazine, inicio"><img class="brand-logo" src="86E2A764-7B66-4070-8F44-7AC422100B93.png" alt="Le Mode TV Magazine"></a></div>
  <nav id="topnav" aria-label="Categorías">
    <button class="active" data-cat="Todo">Inicio</button>
    <button data-cat="Moda">Moda</button>
    <button data-cat="Belleza">Belleza</button>
    <button data-cat="Cultura y entretenimiento">Cultura</button>
    <button data-cat="Estilo de vida">Estilo de vida</button>
    <button data-cat="Tecnología">Tecnología</button>
    <button data-cat="Personajes y trayectorias">Personajes</button>
  </nav>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-content">
      <div class="eyebrow">Tu mundo · Tu estilo · Tu revista</div>
      <h1>Ideas, cultura y conocimiento para una vida con estilo.</h1>
      <p>Una revista digital para descubrir, aprender y explorar temas que permanecen vigentes. Contenido editorial en español, organizado para leer a tu ritmo.</p>
      <button class="btn" onclick="go('Todo');document.getElementById('biblioteca').scrollIntoView({behavior:'smooth'})">Explorar artículos</button>
    </div>
  </section>
